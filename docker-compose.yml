services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamline_tax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=streamline_tax;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      JWT_KEY: ${JWT_KEY:-ChangeMeInProductionAtLeast32CharsLong!!}
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: minioadmin
      Storage__SecretKey: minioadmin
      Frontend__Url: ${FRONTEND_URL:-http://localhost:4200}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-no-reply@streamlinetax.local}
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./src/streamline-tax-ui/dist/streamline-tax-ui:/srv/streamline-tax-ui:ro
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
