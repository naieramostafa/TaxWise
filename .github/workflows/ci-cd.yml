name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StreamlineTax.sln

      - name: Build
        run: dotnet build StreamlineTax.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test StreamlineTax.sln --no-build --configuration Release

      - name: Publish API
        run: dotnet publish src/StreamlineTax.Api/StreamlineTax.Api.csproj -c Release -o artifacts/api

      - uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: artifacts/api

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/streamline-tax-ui/package-lock.json

      - name: Install dependencies
        working-directory: src/streamline-tax-ui
        run: npm ci

      - name: Build
        working-directory: src/streamline-tax-ui
        run: npm run build -- --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: ui-artifact
          path: src/streamline-tax-ui/dist/streamline-tax-ui

  docker-build:
    name: Build Docker Images
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t streamline-tax-api:latest .

      - name: Build UI image
        run: |
          cd src/streamline-tax-ui
          docker build -t streamline-tax-ui:latest .
