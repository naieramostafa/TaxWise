<div class="auth-page">
  <div class="auth-card auth-card--center fade-up">
    <div class="auth-head">
      <div class="auth-logo auth-logo--success">
        <svg viewBox="0 0 24 24" fill="none" width="26" height="26" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h1>Email Confirmation</h1>
      <div *ngIf="loading" class="spinner-dark"></div>
      <p *ngIf="loading" class="muted" style="margin-top:.75rem">Confirming your email...</p>
      <div *ngIf="error" class="alert alert-error">{{ error }}</div>
      <div *ngIf="success" class="alert alert-success">Your email has been confirmed! <a routerLink="/login">Login</a></div>
    </div>
  </div>
</div>
