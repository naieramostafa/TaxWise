<div class="auth-page">
  <div class="auth-card fade-up">
    <div class="auth-head">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" width="26" height="26" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15a2 2 0 100-4 2 2 0 000 4z"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </div>
      <h1>Reset Password</h1>
      <p>Enter your new password below.</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="password">New Password</label>
        <input id="password" class="input" [(ngModel)]="password" name="password" type="password" placeholder="6+ characters" required />
      </div>
      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input id="confirm" class="input" [(ngModel)]="confirm" name="confirm" type="password" placeholder="Re-enter password" required />
      </div>
      <button type="submit" class="btn btn-block" [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        <span *ngIf="!loading">Reset Password</span>
      </button>
      <div *ngIf="error" class="alert alert-error">{{ error }}</div>
      <div *ngIf="success" class="alert alert-success">Password reset! <a routerLink="/login">Login</a></div>
    </form>
  </div>
</div>
