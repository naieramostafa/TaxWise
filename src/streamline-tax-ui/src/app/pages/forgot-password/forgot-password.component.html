<div class="auth-page">
  <div class="auth-card fade-up">
    <div class="auth-head">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" width="26" height="26" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <h1>Forgot Password</h1>
      <p>Enter your email and we'll send a reset link.</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" [(ngModel)]="email" name="email" type="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-block" [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        <span *ngIf="!loading">Send Reset Link</span>
      </button>
      <div *ngIf="error" class="alert alert-error">{{ error }}</div>
      <div *ngIf="sent" class="alert alert-success">{{ sent }}</div>
    </form>
    <p class="auth-foot"><a routerLink="/login">Back to Login</a></p>
  </div>
</div>
