<nav class="navbar" *ngIf="auth.token()">
  <a class="brand" routerLink="/dashboard">
    <span class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
        <path d="M12 17.5a.75.75 0 011.5 0V13h3a.75.75 0 010 1.5h-1.6c-.2 1.5-1.3 2.7-2.9 2.7h-.7v1a.75.75 0 01-1.5 0v-1h-3a.75.75 0 010-1.5h1.6c.2-1.5 1.3-2.7 2.9-2.7h.7v-1a.75.75 0 011.5 0v1H8a.75.75 0 010-1.5h.6c.2-1.5 1.3-2.7 2.9-2.7h2.9v-1a.75.75 0 011.5 0v1h3a.75.75 0 010 1.5h-1.6c.2 1.5 1.3 2.7 2.9 2.7h.9v1.5H12z" fill="#5a67d8"/>
        <rect x="3.5" y="4" width="17" height="14" rx="3" stroke="#667eea" stroke-width="1.6" opacity=".5"/>
      </svg>
    </span>
    StreamlineTax
  </a>
  <div class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Dashboard</a>
    <a routerLink="/receipts" routerLinkActive="active">Receipts</a>
    <a routerLink="/transactions" routerLinkActive="active">Transactions</a>
    <a routerLink="/tax-history" routerLinkActive="active">Tax History</a>
    <a routerLink="/settings" routerLinkActive="active" class="settings-link" [title]="'Settings'">
      <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="settings-text">Settings</span>
    </a>
  </div>
  <div class="nav-right">
    <div class="bell-wrap">
      <button class="bell-btn" (click)="toggleBell()" [title]="'Notifications'">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span class="bell-badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
      </button>
      <div class="bell-dropdown" *ngIf="bellOpen" (click)="$event.stopPropagation()">
        <div class="bell-head">
          <span class="bell-title">Notifications</span>
          <button class="btn-ghost btn-xs" (click)="markAllRead()" [disabled]="unreadCount === 0">Mark all read</button>
        </div>
        <div class="bell-list">
          <div class="bell-item" *ngFor="let n of notifications" [class.unread]="!n.isRead" (click)="markRead(n)">
            <span class="bell-icon" [class]="notificationIcon(n.type)">
              <svg *ngIf="notificationIcon(n.type) === 'ok'" viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              <svg *ngIf="notificationIcon(n.type) === 'fail'" viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
              <svg *ngIf="notificationIcon(n.type) === 'duplicate'" viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 4h12v12H4z"/><path d="M8 8h12v12H8z"/></svg>
              <svg *ngIf="notificationIcon(n.type) === 'lock'" viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <svg *ngIf="notificationIcon(n.type) === 'reminder'" viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
              <svg *ngIf="notificationIcon(n.type) === 'deadline' || notificationIcon(n.type) === 'info'" viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </span>
            <div class="bell-body">
              <div class="bell-msg">
                <strong>{{ n.title }}</strong>
                <span>{{ n.message }}</span>
              </div>
              <span class="bell-time">{{ timeAgo(n.createdAt) }}</span>
            </div>
            <span class="dot" *ngIf="!n.isRead"></span>
          </div>
          <div class="bell-empty" *ngIf="!notifications.length">No notifications yet.</div>
        </div>
      </div>
    </div>
    <button class="theme-toggle" (click)="theme.toggle()" [title]="theme.theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'">
      <ng-container *ngIf="theme.theme() === 'light'; else sun">
        <svg viewBox="0 0 24 24" fill="none" width="17" height="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </ng-container>
      <ng-template #sun>
        <svg viewBox="0 0 24 24" fill="none" width="17" height="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </ng-template>
    </button>
    <div class="user-chip" [title]="auth.email() || ''">
      <span class="avatar">{{ auth.displayName().charAt(0).toUpperCase() }}</span>
      <span class="user-name">{{ auth.displayName() }}</span>
    </div>
    <button class="logout-btn" (click)="auth.logout()">
      <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <path d="M16 17l5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>
      Logout
    </button>
  </div>
</nav>
<main class="app-main">
  <router-outlet />
</main>
